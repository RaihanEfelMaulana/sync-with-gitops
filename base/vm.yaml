apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: hello-vm
  namespace: vm-sample
  labels:
    app: hello-vm
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: hello-vm-root
        annotations:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
      spec:
        source:
          registry:
            url: docker://quay.io/containerdisks/fedora:latest
        storage:
          resources:
            requests:
              storage: 20Gi
  template:
    metadata:
      labels:
        app: hello-vm
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
            - name: rootdisk
              disk: { bus: virtio }
            - name: cloudinit
              disk: { bus: virtio }
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: hello-vm-root
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: hello-vm-cloudinit
